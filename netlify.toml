[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Kök adres = tanıtım sitesi (public/ana-sayfa.dc.html).
# "200!" zorunlu: index.html dosyası var olduğu için normal redirect çalışmaz.
# Uygulama rotaları (/menu, /kasa, /garson, /yonetim) etkilenmez.
[[redirects]]
  from = "/"
  to = "/ana-sayfa.dc.html"
  status = 200
  force = true

# Pazarlama sayfaları için temiz ve paylaşılabilir adresler.
[[redirects]]
  from = "/ozellikler"
  to = "/ozellikler.dc.html"
  status = 200
  force = true

[[redirects]]
  from = "/iletisim"
  to = "/iletisim.dc.html"
  status = 200
  force = true

# SPA fallback — tüm yollar index.html'e gitsin (React Router için)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# index.html, version.json ve kök adres ASLA önbelleğe alınmasın —
# diğer tüm bilgisayarlar ve telefonlar anında en güncel sürümü alsın.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# Service worker & manifest her zaman taze — güncelleme takılmasın
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# Hash'li dosyalar (içerik değişince adı da değişir) sonsuza dek önbellekte
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Tanıtım sayfaları güncellenince anında yansısın
[[headers]]
  for = "/*.dc.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
